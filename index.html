<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Tienda Virtual</title>
    <!-- Hoja de estilos CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Librería para generar la factura en PDF de forma gratuita -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- Encabezado de la página -->
    <header>
        <div class="logo">
            <h1>TechStore 💻</h1>
        </div>
        <nav>
            <button id="btn-cart">🛒 Carrito (<span id="cart-count">0</span>)</button>
        </nav>
    </header>
    </header>

    <!-- Panel de la Laptop Madre / Administrador -->
    <section class="container admin-panel">
        <h3>⚙️ Panel de Control - Laptop Madre (Agregar Producto)</h3>
        <form id="add-product-form" class="form-grid">
            <input type="text" id="new-name" placeholder="Nombre del producto" required>
            <input type="number" step="0.01" id="new-price" placeholder="Precio ($)" required>
            <input type="number" id="new-stock" placeholder="Stock inicial" required>
            <input type="url" id="new-image" placeholder="URL de la imagen (http://...)" required>
            <button type="submit" class="btn-add-prod">➕ Guardar en Google Sheets</button>
        </form>
    </section>

    <!-- Contenido principal: Catálogo de productos -->
    <main class="container">
        <h2>Catálogo de Productos Informáticos</h2>
        <div id="product-grid" class="product-grid">
            <!-- Los productos se cargarán dinámicamente desde app.js -->
        </div>
    </main>

    <!-- Ventana flotante (Modal) del Carrito y Proceso de Pago -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Tu Carrito de Compras</h2>
            
            <div id="cart-items">
                <!-- Lista de productos añadidos -->
            </div>

            <div class="cart-summary">
                <p><strong>Total:</strong> $<span id="cart-total">0.00</span></p>
            </div>

            <hr>

            <!-- Formulario de Pago y Datos para la Factura -->
            <h3>Datos de Compra y Pago Simulado</h3>
            <form id="checkout-form">
                <label for="client-name">Nombre completo:</label>
                <input type="text" id="client-name" placeholder="Ej. Juan Pérez" required>

                <label for="client-email">Correo electrónico (para la factura):</label>
                <input type="email" id="client-email" placeholder="ejemplo@correo.com" required>

                <h4>Tarjeta de Crédito / Débito (Simulación)</h4>
                <label for="card-number">Número de tarjeta (16 dígitos):</label>
                <input type="text" id="card-number" maxlength="16" placeholder="1234 5678 9101 1121" required>

                <div class="form-row">
                    <div>
                        <label for="card-exp">Expiración:</label>
                        <input type="text" id="card-exp" placeholder="MM/AA" required>
                    </div>
                    <div>
                        <label for="card-cvv">CVV:</label>
                        <input type="password" id="card-cvv" maxlength="3" placeholder="123" required>
                    </div>
                </div>

                <button type="submit" class="btn-pay">Confirmar Pago y Generar Factura</button>
            </form>
        </div>
    </div>

    <!-- Enlace al archivo de lógica JavaScript -->
    <script src="app.js"></script>
</body>
</html>
